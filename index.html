<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanner Loomis - Account Executive</title>
    <style>
        /* Base Dark Theme & Typography */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #050505;
            --surface-color: #111111;
            --surface-hover: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(60,60,60,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        /* Layout Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 5%;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Hero Section with Headshot */
        .hero {
            padding: 120px 0 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            animation: fadeIn 1s ease-out;
        }
        
        .hero-content {
            flex: 1;
        }

        .hero-image-container {
            flex-shrink: 0;
        }

            width: 250px;
