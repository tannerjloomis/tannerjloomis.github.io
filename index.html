<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanner Loomis - Account Executive</title>
    <style>
        /* Base Space Theme & Typography */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            /* Swapped pure black for a deep cosmic midnight blue */
            --bg-color: #0b0f19; 
            --surface-color: #131b2f; 
            --surface-hover: #1e2a47; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
            
            /* CSS-Generated Subtle Starfield */
            background-image: 
                radial-gradient(1px 1px at 25px 5px, rgba(255,255,255,0.15) 100%, transparent),
                radial-gradient(1px 1px at 50px 25px, rgba(255,255,255,0.1) 100%, transparent),
                radial-gradient(1px 1px at 125px 20px, rgba(255,255,255,0.2) 100%, transparent),
                radial-gradient(1.5px 1.5px at 50px 75px, rgba(255,255,255,0.25) 100%, transparent),
                radial-gradient(2px 2px at 15px 125px, rgba(255,255,255,0.1) 100%, transparent),
                radial-gradient(2.5px 2.5px at 110px 80px, rgba(255,255,255,0.15) 100%, transparent);
            background-size: 200px 200px;
        }

        /* Nebula Ambient Background Glow */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            /* Faint blue and purple gradient to look like a nebula */
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(139, 92, 246, 0.05) 30%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        /* Layout Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 5%;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--text-main);
        }

        /* Hero Section with Headshot */
        .hero {
            padding: 120px 0 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            animation: fadeIn 1s ease-out;
        }

            flex: 1;
        }
